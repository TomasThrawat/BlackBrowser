name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main

      - name: Apply WebView session fix
        run: |
          set -euo pipefail
          python3 scripts/fix_webview_navigation.py
          if ! git diff --quiet -- app/src/main/java/com/tomasthrawat/blackbrowser/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/tomasthrawat/blackbrowser/MainActivity.kt
            git commit -m "fix: stabilize WebView session navigation"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-read-only: true

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK metadata and signature
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_BUILD_TOOLS="$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          test -x "$SDK_BUILD_TOOLS/apksigner"
          test -x "$SDK_BUILD_TOOLS/zipalign"
          test -x "$SDK_BUILD_TOOLS/aapt"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$SDK_BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          EXPECTED_VERSION_CODE="${GITHUB_RUN_NUMBER:-145}"
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.tomasthrawat.blackbrowser' versionCode='${EXPECTED_VERSION_CODE}'"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
