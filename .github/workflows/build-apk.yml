name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-read-only: true

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace --warning-mode all

      - name: Run Android lint
        run: gradle lintDebug --stacktrace --warning-mode all

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --warning-mode all

      - name: Verify APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          SDK_BUILD_TOOLS="$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          test -x "$SDK_BUILD_TOOLS/apksigner"
          test -x "$SDK_BUILD_TOOLS/zipalign"
          test -x "$SDK_BUILD_TOOLS/aapt"

          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$SDK_BUILD_TOOLS/zipalign" -c -v 4 "$APK"

          EXPECTED_VERSION_CODE="$GITHUB_RUN_NUMBER"
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" |
            grep -F "package: name='com.tomasthrawat.blackbrowser' versionCode='$EXPECTED_VERSION_CODE'"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
