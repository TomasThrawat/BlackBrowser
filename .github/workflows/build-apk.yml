name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare stable signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.BLACKBROWSER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
            test -s "$GITHUB_WORKSPACE/release.keystore"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Stable signing keystore loaded."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Stable signing secret is not configured; using the Gradle debug key as a temporary fallback."
          fi

      - name: Run unit tests and lint
        run: gradle testDebugUnitTest lintRelease --stacktrace

      - name: Build release APK with stable signing
        if: steps.signing.outputs.enabled == 'true'
        env:
          BLACKBROWSER_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          BLACKBROWSER_KEYSTORE_PASSWORD: ${{ secrets.BLACKBROWSER_KEYSTORE_PASSWORD }}
          BLACKBROWSER_KEY_ALIAS: ${{ secrets.BLACKBROWSER_KEY_ALIAS }}
          BLACKBROWSER_KEY_PASSWORD: ${{ secrets.BLACKBROWSER_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Build release APK with debug fallback
        if: steps.signing.outputs.enabled != 'true'
        run: gradle assembleRelease --stacktrace

      - name: Verify APK metadata
        run: |
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          keytool -printcert -jarfile "$APK" | sed -n '1,12p'
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
