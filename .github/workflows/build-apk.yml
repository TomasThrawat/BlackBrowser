name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main

      - name: Recover broken patch script
        run: |
          set -euo pipefail
          PATCHER="scripts/fix_webview_navigation.py"
          if grep -q "BB_WEBVIEW_SESSION_FIX_V3" "$PATCHER"; then
            git fetch --no-tags --depth=1 origin 3e113c7db8fcb35eca0396d10a5cbfcf2b623928
            git checkout 3e113c7db8fcb35eca0396d10a5cbfcf2b623928 -- "$PATCHER"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$PATCHER"
            git commit -m "fix: restore WebView patch script"
            git push
          fi

      - name: Remove automatic browser identity override
        run: |
          set -euo pipefail
          TARGET="app/src/main/java/com/tomasthrawat/blackbrowser/MainActivity.kt"
          python3 - "$TARGET" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "        applyUserAgentDataOverride(wv)\n        applyNavigatorUaPatch(wv)\n",
              "        applyUserAgentDataOverride(wv)\n",
          )

          text = re.sub(
              r'''\n    private val uaSpoofOriginRules: Set<String> =
        uaSpoofHosts\.flatMap \{ listOf\("https://\$it", "https://\*\.\$it"\) \}\.toSet\(\)
''',
              "\n",
              text,
          )

          text = re.sub(
              r'''\n    // Google Identity Services \(the script that renders.*?\n    private fun applyNavigatorUaPatch\(wv: WebView\) \{.*?\n    \}\n''',
              "\n",
              text,
              flags=re.S,
          )

          path.write_text(text, encoding="utf-8")
          PY
          if ! git diff --quiet -- "$TARGET"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$TARGET"
            git commit -m "fix: remove automatic WebView identity override"
            git push
          fi

      - name: Persist Google preference cookies
        run: |
          set -euo pipefail
          TARGET="app/src/main/java/com/tomasthrawat/blackbrowser/MainActivity.kt"
          python3 - "$TARGET" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          helper = '''    private fun isGoogleOriginUrl(rawUrl: String?): Boolean {
              val uri = runCatching { Uri.parse(rawUrl) }.getOrNull() ?: return false
              val host = uri.host?.lowercase() ?: return false
              return host == "google.com" || host.endsWith(".google.com")
          }

'''
          marker = '''    private fun isGoogleSettingsUrl(uri: Uri): Boolean {
'''
          if "private fun isGoogleOriginUrl" not in text:
              if marker not in text:
                  raise SystemExit("Google settings helper anchor not found")
              text = text.replace(marker, helper + marker, 1)

          old = '''                    val finishedUri = runCatching { Uri.parse(url) }.getOrNull()
                    if (finishedUri != null && isGoogleSettingsUrl(finishedUri)) {
                        runCatching { CookieManager.getInstance().flush() }
                    }
'''
          new = '''                    if (isGoogleOriginUrl(url)) {
                        runCatching { CookieManager.getInstance().flush() }
                    }
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif "if (isGoogleOriginUrl(url))" not in text:
              raise SystemExit("Google cookie flush anchor not found")

          path.write_text(text, encoding="utf-8")
          PY
          if ! git diff --quiet -- "$TARGET"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$TARGET"
            git commit -m "fix: persist Google preference cookies"
            git push
          fi

      - name: Apply WebView session fix
        run: |
          set -euo pipefail
          python3 scripts/fix_webview_navigation.py
          if ! git diff --quiet -- app/src/main/java/com/tomasthrawat/blackbrowser/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/tomasthrawat/blackbrowser/MainActivity.kt
            git commit -m "fix: stabilize WebView session navigation"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-read-only: true

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK metadata and signature
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_BUILD_TOOLS="$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          test -x "$SDK_BUILD_TOOLS/apksigner"
          test -x "$SDK_BUILD_TOOLS/zipalign"
          test -x "$SDK_BUILD_TOOLS/aapt"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$SDK_BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          EXPECTED_VERSION_CODE="$GITHUB_RUN_NUMBER"
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.tomasthrawat.blackbrowser' versionCode='${EXPECTED_VERSION_CODE}'"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
