plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tomstrawat.blackbrowser'
    compileSdk 34

    defaultConfig {
        applicationId "com.tomstrawat.blackbrowser"
        minSdk 24
        targetSdk 34

        def ciVersionCode = System.getenv("GITHUB_RUN_NUMBER")
        def computedVersionCode = ciVersionCode?.isInteger() ? ciVersionCode.toInteger() : 5
        versionCode computedVersionCode
        versionName "1.4"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("BLACKBROWSER_KEYSTORE_FILE")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("BLACKBROWSER_KEYSTORE_PASSWORD")
                keyAlias System.getenv("BLACKBROWSER_KEY_ALIAS")
                keyPassword System.getenv("BLACKBROWSER_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            if (System.getenv("BLACKBROWSER_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
}
